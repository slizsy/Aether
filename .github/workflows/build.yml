name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: Aether-windows.exe
          - os: macos-latest
            rid: osx-arm64
            asset: Aether-mac-apple-silicon.zip
          - os: macos-latest
            rid: osx-x64
            asset: Aether-mac-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/Aether -c Release -r ${{ matrix.rid }} -o dist

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/Aether.exe "${{ matrix.asset }}"

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: cd dist && zip -9 "../${{ matrix.asset }}" Aether

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
